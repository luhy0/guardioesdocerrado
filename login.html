<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Guardiões do Cerrado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🐺 Guardiões do Cerrado</h1>
    <nav>
      <a href="/">Início</a>
      <a href="/quiz">Quiz</a>
      <a href="/mapa">Mapa</a>
      <a href="/historias">Histórias</a>
      <a href="/login">Login</a>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-intro">
      <span class="auth-tag">🌿 Área do Guardião</span>
      <h2>Entre na sua missão</h2>
      <p>Use qualquer e-mail/senha para teste local.</p>
    </section>

    <section class="auth-container">
      <form class="auth-card" id="login-form">
        <h3>Entrar</h3>
        <label for="email">E-mail</label>
        <input id="email" type="email" required>
        <label for="senha">Senha</label>
        <input id="senha" type="password" required>
        <button type="submit">Entrar</button>
        <p id="login-feedback" class="auth-feedback"></p>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e){
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();
      const fb = document.getElementById('login-feedback');
      if(!email || !senha){
        fb.textContent = 'Preencha e-mail e senha.';
        fb.className = 'auth-feedback error';
        return;
      }
      fb.textContent = 'Login realizado com sucesso!';
      fb.className = 'auth-feedback success';
      setTimeout(() => window.location.href = '/quiz', 600);
    });
  </script>
</body>
</html>
