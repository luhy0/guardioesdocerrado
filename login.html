<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Guardiões do Cerrado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🐺 Guardiões do Cerrado</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-intro">
            <span class="auth-tag">🌿 Área do Guardião</span>
            <h2>Entre ou crie sua conta</h2>
            <p>Acesse sua jornada pelo Cerrado e acompanhe sua evolução.</p>
        </section>

        <section class="auth-container">
            <form class="auth-card" id="login-form">
                <h3>Entrar</h3>
                <p class="auth-card-text">Já é guardião? Entre para continuar.</p>

                <label for="login-email">E-mail</label>
                <input id="login-email" type="email" required>

                <label for="login-senha">Senha</label>
                <input id="login-senha" type="password" required>

                <button type="submit">Entrar</button>
                <p id="login-feedback" class="auth-feedback"></p>
            </form>

            <form class="auth-card auth-card-destaque" id="register-form">
                <h3>Cadastrar</h3>
                <p class="auth-card-text">Novo por aqui? Crie sua conta gratuitamente.</p>

                <label for="cadastro-nome">Nome</label>
                <input id="cadastro-nome" type="text" required>

                <label for="cadastro-email">E-mail</label>
                <input id="cadastro-email" type="email" required>

                <label for="cadastro-senha">Senha</label>
                <input id="cadastro-senha" type="password" required>

                <button type="submit">Cadastrar</button>
                <p id="register-feedback" class="auth-feedback"></p>
            </form>
        </section>
    </main>

    <script>
      document.getElementById('login-form').addEventListener('submit', function(e){
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        const fb = document.getElementById('login-feedback');

        if(!email || !senha){
          fb.textContent = 'Preencha e-mail e senha.';
          fb.className = 'auth-feedback error';
          return;
        }

        fb.textContent = 'Login realizado com sucesso!';
        fb.className = 'auth-feedback success';
      });

      document.getElementById('register-form').addEventListener('submit', function(e){
        e.preventDefault();
        const nome = document.getElementById('cadastro-nome').value.trim();
        const email = document.getElementById('cadastro-email').value.trim();
        const senha = document.getElementById('cadastro-senha').value.trim();
        const fb = document.getElementById('register-feedback');

        if(!nome || !email || !senha){
          fb.textContent = 'Preencha todos os campos do cadastro.';
          fb.className = 'auth-feedback error';
          return;
        }

        fb.textContent = 'Cadastro realizado com sucesso! Agora faça login.';
        fb.className = 'auth-feedback success';
      });
    </script>
</body>
</html>
