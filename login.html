<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | Guardiões do Cerrado</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🐺 Guardiões do Cerrado</h1><nav><a href="index.html">Início</a><a href="login.html">Login</a></nav></header>
<main class="auth-page"><section class="auth-shell"><div class="auth-intro"><span class="auth-tag">🌿 Área do Guardião</span><h2>Entre ou crie sua conta</h2><p>Comece sua jornada para proteger o Cerrado.</p></div><section class="auth-container">
<form class="auth-card" id="login-form"><h3>Entrar</h3><p class="auth-card-text">Já possui conta? Faça login.</p><label for="login-email">E-mail</label><input id="login-email" type="email" required><label for="login-senha">Senha</label><input id="login-senha" type="password" required><button type="submit">Entrar</button><p id="login-feedback" class="auth-feedback"></p></form>
<form class="auth-card auth-card-destaque" id="register-form"><h3>Cadastrar</h3><p class="auth-card-text">Crie sua conta gratuitamente.</p><label for="cadastro-nome">Nome</label><input id="cadastro-nome" type="text" required><label for="cadastro-email">E-mail</label><input id="cadastro-email" type="email" required><label for="cadastro-senha">Senha</label><input id="cadastro-senha" type="password" required><button type="submit">Cadastrar</button><p id="register-feedback" class="auth-feedback"></p></form>
</section></section></main>
<script type="module" src="firebase.js"></script></body></html>
