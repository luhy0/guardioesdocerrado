<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conquistas</title><link rel="stylesheet" href="/style.css"></head><body>
<header><h1>🏅 Conquistas do Guardião</h1><nav><a href="/home">Home</a><a href="/animais">Animais</a><a href="/perfil">Perfil</a><a href="/logout">Sair</a></nav></header>
<main class="conquistas-page"><section class="animais-topo fade-in-up is-visible"><h2>{{ usuario['nome'] }}</h2><p>Pontos: <strong>{{ usuario['pontos'] }}</strong></p></section>
<section class="conquistas-grid">{% for c in conquistas %}<article class="conquista-card {% if c.unlocked %}unlocked medal-pop{% else %}locked{% endif %}"><div class="medal-icon">{% if c.unlocked %}🏅{% else %}🔒{% endif %}</div><h3>{{ c.nome }}</h3><p>{{ c.descricao }}</p><small>{{ c.pontos_minimos }} pontos</small></article>{% endfor %}</section></main>
</body></html>
