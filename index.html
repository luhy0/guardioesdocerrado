<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões do Cerrado</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENU -->
    <header>
        <h1>🐺 Guardiões do Cerrado</h1>

        <nav>
            <a href="">Início</a>
            <a href="">Espécies</a>
            <a href="">Quiz</a>
            <a href="">Ranking</a>
            <a href="">Login</a>
        </nav>
    </header>

    <!-- BANNER -->
    <section class="banner">

        <div class="texto-banner">
            <h2>Explore, aprenda e preserve.</h2>

            <p>
                Descubra os animais, plantas e curiosidades
                do Cerrado de Goiás de forma divertida.
            </p>

            <button>Começar Missão</button>

        <div class="card">
            <h3>🦊 Espécies</h3>
            <p>Conheça os animais do Cerrado.</p>
        </div>

        <div class="card">
            <h3>🎮 Quiz</h3>
            <p>Teste seus conhecimentos.</p>
        </div>

        <div class="card">
            <h3>🏆 Ranking</h3>
            <p>Veja os melhores guardiões.</p>
        </div>
